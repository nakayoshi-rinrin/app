<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>どこの特産物？</title>
<style>
:root{--bg:#fff6dc;--ink:#3b2a1a;--red:#e8452c;--green:#3cb371;--yellow:#f5b800;--blue:#2b7de9;--off:#e6dcc6;--card:#fffdf6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
background-image:radial-gradient(#f3e3ad 2px,transparent 2px);background-size:26px 26px}
.screen{display:none;min-height:100%;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;position:relative}
.screen.on{display:flex}
h1{font-size:clamp(40px,10vw,84px);margin:8px 0 12px;letter-spacing:.06em;color:var(--red)}
.emojis{font-size:clamp(34px,8vw,60px);letter-spacing:.2em}
.btn{font:inherit;font-weight:800;font-size:clamp(20px,4vw,28px);border:4px solid var(--ink);background:var(--yellow);color:var(--ink);
border-radius:18px;padding:14px 34px;cursor:pointer;box-shadow:0 6px 0 var(--ink);margin:10px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,.fs:focus-visible,.opt:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.fs{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:54px;height:54px;border:3px solid var(--ink);background:var(--card);border-radius:12px;cursor:pointer;font-size:26px}
.credit{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;font-weight:700;font-size:18px}
#quiz{justify-content:flex-start;padding-top:24px}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;font-weight:800;font-size:22px}
.frame{width:100%;max-width:640px;margin:14px 0;padding:14px;border:6px solid var(--ink);border-radius:20px;background:var(--card)}
.cells{display:flex;gap:6px;margin-bottom:12px}
.cell{flex:1;height:26px;border:3px solid var(--ink);border-radius:5px;background:var(--off);transition:background .2s}
.cell.g{background:var(--green)}.cell.y{background:var(--yellow)}.cell.r{background:var(--red)}
.sec{font-size:28px;font-weight:800}
.item{font-size:clamp(28px,7vw,44px);font-weight:800;margin:6px 0}
.pic{font-size:clamp(80px,22vw,140px);line-height:1.1}
.ask{font-size:20px;font-weight:700;margin:4px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:640px}
.opt{font:inherit;font-weight:800;font-size:clamp(22px,5vw,32px);padding:18px 8px;border:4px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.opt:disabled{opacity:.6}
.opt.ok{background:var(--green);color:#fff}
.msg{min-height:44px;font-size:30px;font-weight:800;color:var(--red);margin:10px 0 0}
.msg.good{color:var(--green)}
.big{font-size:clamp(30px,7vw,52px);font-weight:800;line-height:1.4;color:var(--red);margin:10px 0}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.ic{font-size:1.2em;margin-right:8px}
@media (prefers-reduced-motion:no-preference){.shake{animation:sh .35s}}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style>
</head>
<body>

<section id="start" class="screen on">
  <button class="fs" id="fsBtn" aria-label="全画面表示" title="全画面表示">⛶</button>
  <div class="emojis">🍎🍊🍜🐟🍑</div>
  <h1>どこの特産物？</h1>
  <p class="ask">とくさんぶつを見て、どこの県か当てよう！</p>
  <button class="btn" id="startBtn">▶ スタート</button>
  <div class="credit">きだっち＠明倫小</div>
</section>

<section id="quiz" class="screen">
  <div class="top"><span id="qn">1 / 10</span><span id="sec">10</span></div>
  <div class="frame" id="frame">
    <div class="cells" id="cells"></div>
    <div class="pic" id="pic"></div>
    <div class="item" id="item"></div>
    <div class="ask">どこの都道府県のとくさんぶつ？</div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="msg" id="msg"></div>
</section>

<section id="end" class="screen">
  <div class="emojis">🎉🏆🎉</div>
  <div class="big">おめでとう！<br>つぎもがんばろうね！</div>
  <div class="row">
    <button class="btn" id="againBtn"><span class="ic">🔄</span>もういちど</button>
    <button class="btn" id="quitBtn" style="background:#fff"><span class="ic">🚪</span>おわる</button>
  </div>
</section>

<script>
const DATA=[
["りんご","🍎","青森県"],["さくらんぼ","🍒","山形県"],["みかん","🍊","愛媛県"],["もも","🍑","福島県"],
["さつまいも","🍠","鹿児島県"],["ゴーヤ","🥒","沖縄県"],["ぎょうざ","🥟","栃木県"],["お茶","🍵","静岡県"],
["かつおのたたき","🐟","高知県"],["すだち","🍋","徳島県"],["カステラ","🍰","長崎県"],["有明のり","🍙","佐賀県"],
["スイカ","🍉","熊本県"],["かぼす","🍋","大分県"],["マンゴー","🥭","宮崎県"],["二十世紀なし","🍐","鳥取県"],
["しじみ","🐚","島根県"],["もみじまんじゅう","🍁","広島県"],["ふぐ","🐡","山口県"],["讃岐うどん","🍜","香川県"],
["明太子","🐟","福岡県"],["納豆","🫘","茨城県"],["らっかせい","🥜","千葉県"],["こんにゃく","🍢","群馬県"],
["わんこそば","🍜","岩手県"],["きりたんぽ","🍲","秋田県"],["じゃがいも","🥔","北海道"],["ずんだもち","🟢","宮城県"],
["伊勢えび","🦞","三重県"],["飛騨牛","🐄","岐阜県"],["神戸牛","🥩","兵庫県"],["八つ橋","🍡","京都府"],
["柿の葉ずし","🍣","奈良県"],["金箔","✨","石川県"],["コシヒカリ","🍚","新潟県"],["ぶどう","🍇","山梨県"],
["ひつまぶし","🍱","愛知県"],["越前ガニ","🦀","福井県"],["ますずし","🍣","富山県"],["たこ焼き","🐙","大阪府"]
];
const PREFS="北海道 青森県 岩手県 宮城県 秋田県 山形県 福島県 茨城県 栃木県 群馬県 埼玉県 千葉県 東京都 神奈川県 新潟県 富山県 石川県 福井県 山梨県 長野県 岐阜県 静岡県 愛知県 三重県 滋賀県 京都府 大阪府 兵庫県 奈良県 和歌山県 鳥取県 島根県 岡山県 広島県 山口県 徳島県 香川県 愛媛県 高知県 福岡県 佐賀県 長崎県 熊本県 大分県 宮崎県 鹿児島県 沖縄県".split(" ");
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));

/* ---- おんがく ---- */
let ac;
function tone(f,t,d,type="triangle",v=.25){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,ac.currentTime+t);g.gain.linearRampToValueAtTime(v,ac.currentTime+t+.02);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);
  o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d+.05);
}
function play(notes,step,len){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();notes.forEach((f,i)=>tone(f,i*step,len))}catch(e){}}
const okSound=()=>play([523,659,784,1047],.11,.25);
const clearSound=()=>play([523,523,659,784,659,784,1047,1047,1319],.16,.35);
const ngSound=()=>play([300,240],.15,.25);

/* ---- ゲーム ---- */
const TOTAL=10,LIMIT=10;
let qs=[],idx=0,timer=null,t0=0,locked=false;
const cellsEl=$("cells");
for(let i=0;i<LIMIT;i++){const c=document.createElement("div");c.className="cell";cellsEl.appendChild(c)}

function start(){qs=shuffle(DATA).slice(0,TOTAL);idx=0;show("quiz");ask()}
function ask(){
  const q=qs[idx];locked=false;$("msg").textContent="";$("msg").className="msg";
  $("qn").textContent=(idx+1)+" / "+TOTAL;
  $("pic").textContent=q[1];$("item").textContent=q[0];
  choices();startTimer();
}
function choices(){
  const q=qs[idx];
  const others=shuffle(PREFS.filter(p=>p!==q[2])).slice(0,3);
  const box=$("opts");box.innerHTML="";
  shuffle([q[2],...others]).forEach(p=>{
    const b=document.createElement("button");b.className="opt";b.textContent=p;
    b.onclick=()=>pick(b,p);box.appendChild(b);
  });
}
function startTimer(){
  clearInterval(timer);t0=performance.now();draw(LIMIT);
  timer=setInterval(()=>{
    const left=Math.max(0,LIMIT-(performance.now()-t0)/1000);
    draw(left);
    if(left<=0){clearInterval(timer);wrong("じかんぎれ！")}
  },100);
}
function draw(left){
  const n=Math.ceil(left);
  const cls=n>6?"g":n>3?"y":"r";
  [...cellsEl.children].forEach((c,i)=>{c.className="cell"+(i<n?" "+cls:"")});
  $("sec").textContent="のこり "+n+" びょう";
}
function pick(btn,p){
  if(locked)return;
  if(p===qs[idx][2]){
    locked=true;clearInterval(timer);btn.classList.add("ok");
    $("msg").textContent="せいかい！⭕";$("msg").className="msg good";
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    okSound();
    setTimeout(()=>{idx++;idx>=TOTAL?finish():ask()},1100);
  }else wrong("もうちょっと");
}
function wrong(text){
  if(locked)return;locked=true;clearInterval(timer);
  ngSound();
  $("msg").textContent=text+"　もういちど えらんでね";
  const f=$("frame");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  setTimeout(()=>{locked=false;$("msg").textContent="";choices();startTimer()},1400); /* 選択肢を並び替えて再挑戦 */
}
function finish(){clearInterval(timer);show("end");clearSound()}

$("startBtn").onclick=()=>{play([784],0,.05);start()};
$("againBtn").onclick=start;
$("quitBtn").onclick=()=>{clearInterval(timer);show("start")};
$("fsBtn").onclick=()=>{
  try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}
};
</script>
</body>
</html>
