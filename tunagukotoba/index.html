<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>つなぐ言葉</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#3a2e24;--sub:#7a6a5a;--main:#e8590c;--main2:#fcc419;--ok:#2f9e44;--ng:#d6336c;--line:#f0d9b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2118;--card:#3a2e24;--ink:#fff3e0;--sub:#d8c3a5;--line:#5a4733}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:700;overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;position:relative}
.screen{display:none;width:100%;max-width:760px;text-align:center}
.screen.on{display:block}
h1{font-size:clamp(34px,8vw,64px);margin:0 0 8px;color:var(--main);font-weight:900;letter-spacing:.05em}
.sub{color:var(--sub);margin:0 0 28px;font-size:clamp(16px,3vw,22px)}
.btn{font:inherit;border:0;border-radius:20px;padding:16px 28px;font-size:clamp(20px,4vw,28px);cursor:pointer;color:#fff;background:var(--main);box-shadow:0 6px 0 #a63d08;margin:8px;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a63d08}
.btn.b2{background:#1c7ed6;box-shadow:0 6px 0 #0b4f94}
.btn.b2:active{box-shadow:0 2px 0 #0b4f94}
.btn.gray{background:#868e96;box-shadow:0 6px 0 #495057}
.lv small{display:block;font-size:.55em;font-weight:500;opacity:.9}
#fs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:5;font:inherit;font-size:16px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
#credit{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;color:var(--sub);font-size:clamp(16px,3vw,20px);pointer-events:none}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:22px 18px;margin:12px 0}
.prog{color:var(--sub);font-size:20px}
.q{font-size:clamp(22px,4.6vw,32px);line-height:1.9;text-align:left}
.q .gap{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--main);text-align:center;color:var(--main)}
.q .line2{display:block}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch{font:inherit;font-size:clamp(20px,4.4vw,30px);padding:16px 8px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--line)}
.ch:active{transform:translateY(3px)}
.ch.bad{background:var(--ng);color:#fff;border-color:var(--ng);opacity:.55;pointer-events:none}
.ch.good{background:var(--ok);color:#fff;border-color:var(--ok)}
#fb{min-height:52px;font-size:clamp(24px,5vw,36px);font-weight:900;margin:6px 0}
.fb-ok{color:var(--ok)}.fb-ng{color:var(--ng)}
.score{font-size:clamp(28px,6vw,44px);margin:12px 0}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
</style>
</head>
<body>
<button id="fs">⛶ 全画面</button>
<canvas id="fx"></canvas>
<div id="app">
  <section class="screen on" id="s-start">
    <h1>つなぐ言葉</h1>
    <p class="sub">小学４年生 国語</p>
    <button class="btn lv" data-lv="easy">かんたん<small>２つの文を つなぐ</small></button>
    <button class="btn b2 lv" data-lv="hard">むずかしい<small>１つの文の つなぐ言葉</small></button>
  </section>
  <section class="screen" id="s-quiz">
    <div class="prog" id="prog"></div>
    <div class="card"><div class="q" id="q"></div></div>
    <div id="fb"></div>
    <div class="choices" id="choices"></div>
    <button class="btn" id="next" style="display:none">つぎへ ▶</button>
  </section>
  <section class="screen" id="s-end">
    <h1 id="endT"></h1>
    <div class="score" id="endS"></div>
    <button class="btn" id="again">もういちど</button>
    <button class="btn gray" id="home">さいしょへ</button>
  </section>
</div>
<div id="credit">きだっち＠明倫小</div>

let AC;
function tone(freq,t0,dur,type='triangle',vol=.25){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;
  const t=AC.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}
}

function bigSound(){
  const m=[["C5",0,.2],["E5",.2,.2],["G5",.4,.2],["C6",.6,.4],["G5",1.1,.2],["A5",1.3,.2],["C6",1.5,.2],["E5",1.8,.2],["G5",2.0,.2],["C6",2.2,.2],["D5",2.6,.2],["G5",2.8,.2],["C6",3.0,.8]];
  m.forEach(([n,t,d])=>{tone(N[n],t,d+.2,'triangle',.28);tone(N[n]/2,t,d+.2,'sine',.15)});
}
let mode,qs,idx,miss,missedNow;

}
function render(){
  missedNow=false;

    $('q').innerHTML=`<span>${q[0]}</span><span class="line2"><span class="gap" id="gap">？</span>、${q[1]}</span>`;

    $('q').innerHTML=q[0].replace('（　）','<span class="gap" id="gap">？</span>');
    ans=q[1];ch=q[2];

  const box=$('choices');box.innerHTML='';

    const b=document.createElement('button');b.className='ch';b.textContent=c;
    b.onclick=()=>pick(b,c,ans);box.appendChild(b);
  });
}

    document.querySelectorAll('.ch').forEach(x=>x.style.pointerEvents='none');
    okSound();
    $('next').textContent=idx===4?'けっかを見る ▶':'つぎへ ▶';$('next').style.display='inline-block';
  }else{
    b.classList.add('bad');
    if(!missedNow){missedNow=true;miss++}
    $('fb').textContent='もうちょっと';$('fb').className='fb-ng';
    ngSound();
  }
}
$('next').onclick=()=>{if(idx===4)finish();else{idx++;render()}};
function finish(){
  show('s-end');
  const score=5-miss;
  if(miss===0){
    $('endT').textContent='🌸 ぜんもんせいかい！ 🌸';
    $('endS').textContent='5もん ぜんぶ せいかい！すごい！';
    bigSound();petals(true);
  }else{
    $('endT').textContent='おつかれさま！';
    $('endS').textContent=`1回で正かいできたのは ${Math.max(0,5-miss)} もん / 5もん`;
    okSound();
  }
}
$('again').onclick=()=>start(mode);
$('home').onclick=()=>show('s-start');
document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}start(b.dataset.lv)});
$('fs').onclick=()=>{
  try{
    if(document.fullscreenElement)document.exitFullscreen();
    else (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement);
  }catch(e){}
};
/* 花吹雪 */
const cv=$('fx'),cx=cv.getContext('2d');let P=[],running=false;
function sz(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',sz);sz();
function petals(){
  P=[];for(let i=0;i<160;i++)P.push({x:Math.random()*cv.width,y:-Math.random()*cv.height,r:6+Math.random()*10,vx:-1+Math.random()*3,vy:1.5+Math.random()*3,a:Math.random()*6,va:(Math.random()-.5)*.1,c:['#ffb3c7','#ff8fab','#ffd6e0','#fff0f3'][Math.random()*4|0]});
  if(!running){running=true;loop()}
  setTimeout(()=>{P.forEach(p=>p.last=true)},9000);
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  P.forEach(p=>{
    p.x+=p.vx+Math.sin(p.a)*1.5;p.y+=p.vy;p.a+=p.va+.03;
    if(p.y>cv.height+20){if(p.last){p.dead=true}else{p.y=-20;p.x=Math.random()*cv.width}}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;
    cx.beginPath();cx.ellipse(0,0,p.r,p.r*.6,0,0,6.3);cx.fill();cx.restore();
  });
  P=P.filter(p=>!p.dead);
  if(P.length)requestAnimationFrame(loop);else{running=false;cx.clearRect(0,0,cv.width,cv.height)}
}
</script>
