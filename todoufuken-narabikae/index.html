<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>都道府県名ならべ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:#fff6d6;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#4a3b2a;overflow:hidden;user-select:none}
.scr{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.scr.on{display:flex}
h1{font-size:clamp(34px,9vw,60px);margin:0;color:#ff7a45;text-shadow:3px 3px 0 #fff}
.btn{border:none;border-radius:40px;padding:14px 38px;font-size:26px;font-weight:bold;color:#fff;background:#ff8a4c;box-shadow:0 6px 0 #d86a2f;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d86a2f}
.btn.g{background:#5bbf6a;box-shadow:0 6px 0 #3f9a4d}
.btn.b{background:#5aa9e6;box-shadow:0 6px 0 #3d86bd}
#fs{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;width:46px;height:46px;border-radius:12px;border:none;background:#fff;font-size:24px;box-shadow:0 3px 0 #e0c98a;cursor:pointer}
.foot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:18px;color:#a07a3c}
.top{width:100%;max-width:460px;display:flex;justify-content:space-between;font-size:20px;font-weight:bold}
#map{width:min(56vw,250px);height:min(56vw,250px);background:#d9f0ff;border-radius:20px;border:4px solid #fff}
#timer{display:flex;gap:4px;width:100%;max-width:460px}
#timer i{flex:1;height:22px;border:3px solid #4a3b2a;border-radius:5px;background:var(--c,#5bbf6a);transition:background .3s}
#timer i.off{background:#fff;border-color:#cbb98f}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:64px}
.slot,.tile{width:clamp(48px,14vw,68px);height:clamp(48px,14vw,68px);border-radius:12px;font-size:clamp(26px,8vw,38px);display:flex;align-items:center;justify-content:center;font-weight:bold;font-family:inherit}
.slot{border:3px dashed #d3b56a;background:#fff}
.slot.f{border:3px solid #ff8a4c;cursor:pointer}
.tile{border:none;background:#ffd35c;color:#4a3b2a;box-shadow:0 5px 0 #d9a92a;cursor:pointer}
.tile.u{visibility:hidden}
#msg{font-size:28px;font-weight:bold;min-height:38px;color:#e2483d}
#msg.ok{color:#3f9a4d}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:sh .3s}
</style></head><body>

<div class="scr on" id="s0">
 <button id="fs" title="ぜんがめん" aria-label="全画面">⛶</button>
 <h1>都道府県名ならべ</h1>
 <svg width="300" height="190" viewBox="0 0 300 190" aria-hidden="true" style="max-width:88vw;border-radius:20px">
  <rect width="300" height="190" fill="#bfe6ff"/>
  <circle cx="222" cy="52" r="24" fill="#ff5a5f"/>
  <ellipse cx="60" cy="42" rx="30" ry="11" fill="#fff"/><ellipse cx="82" cy="36" rx="22" ry="10" fill="#fff"/>
  <ellipse cx="250" cy="100" rx="24" ry="8" fill="#fff" opacity=".8"/>
  <polygon points="40,170 128,62 172,62 260,170" fill="#6f8fd6"/>
  <polygon points="128,62 172,62 186,88 168,80 150,94 132,80 114,88" fill="#fff"/>
  <rect y="160" width="300" height="30" fill="#8ed6a0"/>
  <rect x="24" y="118" width="7" height="50" fill="#e2483d"/><rect x="66" y="118" width="7" height="50" fill="#e2483d"/>
  <rect x="16" y="108" width="66" height="9" rx="3" fill="#e2483d"/><rect x="22" y="126" width="54" height="5" fill="#e2483d"/>
  <rect x="236" y="130" width="8" height="42" fill="#8a5a3c"/>
  <circle cx="240" cy="122" r="20" fill="#ffb7c5"/><circle cx="224" cy="132" r="14" fill="#ffc8d3"/><circle cx="257" cy="132" r="14" fill="#ffc8d3"/>
  <circle cx="200" cy="165" r="3" fill="#ffb7c5"/><circle cx="270" cy="168" r="3" fill="#ffb7c5"/><circle cx="215" cy="172" r="3" fill="#ffb7c5"/>
 </svg>
 <button class="btn" id="start">はじめる</button>
 <div class="foot">きだっち＠明倫小</div>
</div>

<div class="scr" id="s1">
 <div class="top"><span id="no"></span><span id="hint"></span></div>
 <svg id="map" viewBox="0 0 400 400"></svg>
 <div id="timer"></div>
 <div id="msg"></div>
 <div class="row" id="slots"></div>
 <div class="row" id="tiles"></div>
</div>

<div class="scr" id="s2">
 <h1 style="font-size:clamp(28px,7vw,48px)">おめでとう！<br>つぎもがんばろうね！</h1>
 <div style="font-size:80px">🎉</div>
 <button class="btn g" id="again">もういちど</button>
 <button class="btn b" id="end">おわる</button>
</div>

<script>
const P="北海道|ほっかいどう|142.8|43.4,青森|あおもり|140.7|40.8,岩手|いわて|141.3|39.6,宮城|みやぎ|140.9|38.4,秋田|あきた|140.1|39.7,山形|やまがた|140.1|38.4,福島|ふくしま|140.4|37.4,茨城|いばらき|140.3|36.3,栃木|とちぎ|139.8|36.7,群馬|ぐんま|139|36.5,埼玉|さいたま|139.4|36,千葉|ちば|140.2|35.4,東京|とうきょう|139.6|35.7,神奈川|かながわ|139.4|35.4,新潟|にいがた|138.9|37.5,富山|とやま|137.2|36.6,石川|いしかわ|136.8|36.8,福井|ふくい|136.2|35.8,山梨|やまなし|138.6|35.6,長野|ながの|138|36.1,岐阜|ぎふ|137|35.8,静岡|しずおか|138.3|35,愛知|あいち|137.2|35,三重|みえ|136.4|34.5,滋賀|しが|136.1|35.2,京都|きょうと|135.4|35.2,大阪|おおさか|135.5|34.6,兵庫|ひょうご|134.8|35,奈良|なら|135.9|34.4,和歌山|わかやま|135.5|33.9,鳥取|とっとり|134|35.4,島根|しまね|132.8|35,岡山|おかやま|133.7|34.9,広島|ひろしま|132.8|34.6,山口|やまぐち|131.6|34.2,徳島|とくしま|134.3|33.9,香川|かがわ|134|34.2,愛媛|えひめ|132.9|33.6,高知|こうち|133.3|33.4,福岡|ふくおか|130.6|33.5,佐賀|さが|130.1|33.2,長崎|ながさき|129.8|33,熊本|くまもと|130.8|32.6,大分|おおいた|131.4|33.2,宮崎|みやざき|131.3|32.1,鹿児島|かごしま|130.7|31.5,沖縄|おきなわ|127.7|26.4".split(",").map(s=>{const a=s.split("|");return{k:a[0],h:a[1],x:(a[2]-126)*20,y:(46-a[3])*19}});
const J=[[[141.3,45.5],[142.9,44.3],[145.3,43.3],[143.3,42],[141,41.8],[140.1,41.5],[140.3,43.2]],
[[140.4,41.2],[141.5,40.5],[142,39.5],[141.5,38.3],[141,36.8],[140.9,35.7],[139.9,35.1],[139.6,35.3],[138.9,34.7],[137.3,34.6],[136.9,34.2],[136,33.5],[135.2,33.5],[135.1,34.6],[133,34.4],[131,33.9],[131,34.4],[132.5,35.4],[134.5,35.6],[136,35.7],[136.7,37],[138.5,37.5],[139.5,38.5],[140,40]],
[[132.5,33.9],[134.2,34.2],[134.7,33.8],[134,33.3],[133,32.8],[132.5,33.5]],
[[130,33.9],[131.6,33.6],[131.9,32.7],[131.4,31.4],[130.6,31],[130.2,31.3],[130.2,32.6],[129.8,33.2]],
[[127.4,26.7],[128,26.5],[127.8,26.1],[127.5,26.2]]];
const $=id=>document.getElementById(id);
const show=n=>{for(let i=0;i<3;i++)$("s"+i).classList.toggle("on",i==n)};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

// audio
let ac;
function tone(f,t,d,type="triangle",v=.25){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}
function seq(n,step=.14){n.forEach((f,i)=>tone(f,i*step,.3))}
const sndOk=()=>seq([523,659,784,1047]);
const sndNg=()=>{tone(300,0,.25,"square",.12);tone(240,.15,.3,"square",.12)};
const sndWin=()=>{seq([523,659,784,1047,784,1047,1319,1568],.16);[523,659,784].forEach(f=>tone(f,1.4,.9))};

// map
const map=$("map");
map.innerHTML=J.map(p=>`<polygon points="${p.map(q=>((q[0]-126)*20)+","+((46-q[1])*19)).join(" ")}" fill="#8ed6a0" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>`).join("")+'<g id="pin"></g>';
function pin(p){$("pin").innerHTML=`<circle cx="${p.x}" cy="${p.y}" r="26" fill="#ff5a5f" opacity=".3"><animate attributeName="r" values="12;30;12" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="${p.x}" cy="${p.y}" r="10" fill="#e2483d" stroke="#fff" stroke-width="3"/>`}

// game
let qs,qi,cur,tiles,slots,tmr,left;
const T=$("timer");
function start(){qs=shuf(P).slice(0,10);qi=0;show(1);next()}
function next(){cur=qs[qi];$("no").textContent=`${qi+1} / 10`;$("hint").textContent="";pin(cur);setup()}
function setup(){
 clearInterval(tmr);$("msg").textContent="";$("msg").className="";
 let a,n=0;do{a=shuf([...cur.h].map((c,i)=>({c,i})))}while(a.map(t=>t.c).join("")===cur.h&&++n<20&&cur.h.length>1);
 tiles=a;slots=[];draw();
 left=10;tick();
 tmr=setInterval(()=>{left--;tick();if(left<=0){clearInterval(tmr);$("msg").textContent="じかんぎれ！もういちど";sndNg();setTimeout(setup,900)}},1000);
}
function tick(){
 T.innerHTML="";for(let i=0;i<10;i++){const e=document.createElement("i");if(i>=left)e.className="off";T.appendChild(e)}
 T.style.setProperty("--c",left>6?"#5bbf6a":left>3?"#ffb833":"#e2483d");
}
function draw(){
 const sl=$("slots");sl.innerHTML="";
 for(let i=0;i<cur.h.length;i++){const d=document.createElement("div");d.className="slot";const t=slots[i];if(t){d.classList.add("f");d.textContent=t.c;d.onclick=()=>{slots.splice(i,1);tiles.push(t);draw()}}sl.appendChild(d)}
 const tl=$("tiles");tl.innerHTML="";
 tiles.forEach(t=>{const b=document.createElement("button");b.className="tile";b.textContent=t.c;b.onclick=()=>{tiles=tiles.filter(x=>x!==t);slots.push(t);draw();if(slots.length==cur.h.length)check()};tl.appendChild(b)});
}
function check(){
 if(slots.map(t=>t.c).join("")===cur.h){
  clearInterval(tmr);sndOk();$("msg").className="ok";$("msg").textContent="せいかい！ "+cur.k;
  setTimeout(()=>{qi++;qi>=10?win():next()},1300);
 }else{
  sndNg();$("msg").textContent="もうちょっと";$("slots").classList.add("shake");
  setTimeout(()=>{$("slots").classList.remove("shake");tiles=tiles.concat(slots);slots=[];$("msg").textContent="";draw()},700);
 }
}
function win(){show(2);setTimeout(sndWin,200)}

$("start").onclick=()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();start()};
$("again").onclick=start;
$("end").onclick=()=>{clearInterval(tmr);show(0)};
$("fs").onclick=()=>{const d=document,e=d.documentElement;try{d.fullscreenElement?d.exitFullscreen():e.requestFullscreen&&e.requestFullscreen()}catch(x){}};
</script>
</body></html>
