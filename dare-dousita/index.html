<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>だれが、なにをしているの？</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: a classroom blackboard in a wooden frame; white "print" cards hold the picture and the answers. */
:root{
  --board:#1f4a3c; --board-dark:#163a2e; --chalk:#f7f5ee;
  --yellow:#ffd84a; --pink:#ff9bb3; --blue:#8fd3ff;
  --wood:#b9854a; --wood-dark:#8a5d2b;
  --paper:#ffffff; --ink:#23302b; --ink-soft:#5b6b64; --line:#d9e2dd;
  --ok:#14804a; --ok-bg:#dff6e8; --warn:#c2410c; --warn-bg:#ffe9d6;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--board);color:var(--chalk);font-family:var(--font);font-weight:700;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input{font-family:inherit}
#app{position:relative;min-height:100%;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.07),transparent 55%),
             radial-gradient(ellipse at 80% 90%,rgba(255,255,255,.05),transparent 50%),var(--board);
  box-shadow:inset 0 0 0 10px var(--wood),inset 0 0 0 14px var(--wood-dark);
  padding-block:30px;
  padding-left:max(30px,env(safe-area-inset-left,0px));
  padding-right:max(30px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.screen[hidden]{display:none!important}

/* shared buttons */
.btn{appearance:none;border:0;cursor:pointer;border-radius:20px;font-weight:900;color:var(--ink);
  padding:14px 26px;font-size:clamp(20px,2.6vw,28px);background:var(--yellow);
  box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn:focus-visible,.chip:focus-visible,.choice:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.btn.pink{background:var(--pink)} .btn.white{background:#fff}
.chip{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:2px solid rgba(247,245,238,.7);
  background:rgba(0,0,0,.18);color:var(--chalk);border-radius:999px;padding:8px 16px;font-size:16px;font-weight:700}
.chip:hover{background:rgba(0,0,0,.3)}
.chip svg{width:20px;height:20px;flex:none}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* start */
#start{align-items:center}
#start .toolbar{width:100%}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4vh,40px);text-align:center;padding-block:10px}
.title{margin:0;font-weight:900;line-height:1.25;font-size:clamp(34px,7.4vw,84px);letter-spacing:.02em;text-wrap:balance;
  text-shadow:2px 3px 0 rgba(0,0,0,.25)}
.title .w1{color:var(--yellow)} .title .w2{color:var(--pink)} .title .q{color:var(--blue)}
.sub{margin:0;font-size:clamp(16px,2vw,22px);color:rgba(247,245,238,.85);font-weight:500}
.modes{width:100%;display:flex;gap:clamp(14px,3vw,34px);flex-wrap:wrap;justify-content:center}
.mode{min-width:min(100%,260px);padding:18px 30px;display:flex;flex-direction:column;gap:4px;align-items:center}
.mode b{font-size:clamp(28px,4vw,44px);font-weight:900}
.mode span{font-size:clamp(14px,1.7vw,18px);font-weight:700;opacity:.8}
.credit{text-align:center;font-size:clamp(18px,2.2vw,24px);padding-top:8px;letter-spacing:.06em;color:var(--chalk)}

/* quiz */
.qhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.qhead .left{justify-self:start}.qhead .right{justify-self:end;display:flex;gap:8px;align-items:center}
.progress{display:flex;flex-direction:column;align-items:center;gap:6px}
.progress .num{font-size:clamp(18px,2.4vw,26px);font-weight:900}
.dots{display:flex;gap:8px}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--chalk);background:transparent}
.dot.now{background:var(--yellow);border-color:var(--yellow)}
.dot.ok{background:#5ee6a0;border-color:#5ee6a0}
.dot.miss{background:var(--pink);border-color:var(--pink)}
.modebadge{font-size:14px;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.25);border:2px solid rgba(247,245,238,.5)}
.qmain{flex:1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(14px,2.4vw,30px);align-items:stretch;padding-top:18px;min-height:0}
.pic{background:var(--paper);border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:clamp(10px,2vw,24px);min-height:260px}
.pic img{display:block;width:100%;height:auto;max-height:min(64vh,560px);object-fit:contain}
.panel{background:var(--paper);color:var(--ink);border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.25);padding:clamp(16px,2.2vw,28px);display:flex;flex-direction:column;gap:14px;min-width:0}
.prompt{display:flex;align-items:center;gap:12px;font-size:clamp(26px,3.6vw,40px);font-weight:900}
.prompt .tag{flex:none;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;font-size:.7em;background:var(--yellow)}
.prompt .tag.t2{background:var(--pink)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{appearance:none;cursor:pointer;border:3px solid var(--line);background:#f6faf8;color:var(--ink);border-radius:18px;
  min-height:clamp(64px,10vh,92px);padding:10px 12px;font-size:clamp(18px,2.5vw,28px);font-weight:900;line-height:1.3;text-wrap:balance;
  box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s,background .15s}
.choice:hover{background:#eef7f2}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.choice.ng{opacity:.45;background:#f1f1f1;text-decoration:line-through;text-decoration-thickness:2px;pointer-events:none}
.choice.good{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 5px 0 var(--ok);color:var(--ok);pointer-events:none}
.choice.shake,.inputrow.shake{animation:shake .4s}
.choices.done .choice:not(.good){opacity:.45;pointer-events:none}
.inputrow{display:flex;gap:10px;flex-wrap:wrap}
.inputrow input{flex:1 1 220px;min-width:0;font-size:clamp(22px,3vw,34px);font-weight:700;padding:12px 16px;border:3px solid var(--line);border-radius:16px;color:var(--ink);background:#fff}
.inputrow input:disabled{background:#f1f1f1}
.inputrow .btn{padding:12px 24px;font-size:clamp(18px,2.4vw,26px)}
.hintline{margin-top:10px!important;font-size:15px;color:var(--ink-soft);font-weight:500;margin:0}
.fb{min-height:3.2em;display:flex;align-items:center;gap:10px;border-radius:16px;padding:8px 16px;font-size:clamp(20px,2.8vw,30px);font-weight:900;visibility:hidden}
.fb.show{visibility:visible;animation:pop .35s}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.ng{background:var(--warn-bg);color:var(--warn)}
.fb small{font-size:.62em;font-weight:700;color:var(--ink)}
.sentence{margin-top:auto;border-top:3px dashed var(--line);padding-top:14px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 4px;
  font-size:clamp(20px,2.9vw,32px);font-weight:900;line-height:1.5}
.slot{display:inline-block;min-width:4.2em;padding:0 8px;border-bottom:4px solid var(--line);text-align:center;color:transparent;min-height:1.5em}
.slot.active{background:#fff6cc;border-bottom-color:var(--yellow);animation:blink 1.2s infinite}
.slot.filled{color:var(--ink);border-bottom-color:var(--ok);background:transparent;animation:none}
.slot.missed{color:var(--warn);border-bottom-color:var(--warn);background:transparent;animation:none}
.nextrow{display:flex;justify-content:flex-end}
.nextrow[hidden]{display:none}

/* result */
#result{align-items:center}
.res{flex:1;width:100%;max-width:980px;margin-inline:auto;display:flex;flex-direction:column;align-items:center;gap:16px;justify-content:center;padding-block:8px;text-align:center}
.res h2{margin:0;font-size:clamp(30px,5.6vw,64px);font-weight:900;text-wrap:balance;line-height:1.25}
.res h2 em{font-style:normal;color:var(--yellow)}
.res p{margin:0;font-size:clamp(16px,2.2vw,22px);font-weight:700}
.list{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:6px}
.rrow{background:var(--paper);color:var(--ink);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.rrow img{width:84px;height:64px;object-fit:contain;flex:none}
.rrow .t{font-size:clamp(15px,1.9vw,19px);line-height:1.45;min-width:0;flex:1}
.mark{flex:none;font-size:clamp(14px,1.8vw,18px);font-weight:900;padding:4px 10px;border-radius:999px;text-align:center}
.mark.ok{color:var(--ok);background:var(--ok-bg)} .mark.miss{color:var(--warn);background:var(--warn-bg)}
.resbtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding-top:6px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:var(--ink);padding:10px 18px;border-radius:14px;font-size:16px;box-shadow:0 6px 0 rgba(0,0,0,.25);z-index:60;max-width:90vw}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes blink{0%,100%{background:#fff6cc}50%{background:#ffe680}}
@media (max-width:760px){
  #app{padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .qmain{grid-template-columns:minmax(0,1fr)}
  .pic{min-height:0}.pic img{max-height:34vh}
  .qhead{grid-template-columns:auto 1fr auto}
  .modebadge{display:none}
  .chip .lbl-sm{display:none}
}
@media (prefers-reduced-motion:reduce){
  .choice.shake,.inputrow.shake,.fb.show,.slot.active{animation:none}
}
</style>

<div id="app">
  <!-- Start -->
  <section id="start" class="screen">
    <div class="toolbar">
      <button class="chip" id="fsBtn" type="button" aria-label="ぜんがめん">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span id="fsLbl">ぜんがめん</span>
      </button>
      <button class="chip sndBtn" type="button" aria-label="おと"></button>
    </div>
    <div class="hero">
      <h1 class="title"><span class="w1">だれが</span>、<span class="w2">なにを</span><br>しているの<span class="q">？</span></h1>
      <p class="sub">イラストを みて こたえよう。5もん ちょうせん！</p>
      <div class="modes">
        <button class="btn mode" type="button" data-mode="easy"><b>かんたん</b><span>4つの なかから えらぶ</span></button>
        <button class="btn mode pink" type="button" data-mode="hard"><b>むずかしい</b><span>じぶんで ことばを うつ</span></button>
      </div>
    </div>
    <div class="credit">きだっち＠明倫小</div>
  </section>

  <!-- Quiz -->
  <section id="quiz" class="screen" hidden>
    <div class="qhead">
      <div class="left"><button class="chip" id="quitBtn" type="button">← やめる</button></div>
      <div class="progress"><div class="num" id="qnum">もんだい 1 / 5</div><div class="dots" id="dots"></div></div>
      <div class="right"><span class="modebadge" id="modeBadge"></span><button class="chip sndBtn" type="button" aria-label="おと"></button></div>
    </div>
    <div class="qmain">
      <div class="pic"><img id="pic" alt="イラスト"></div>
      <div class="panel">
        <div class="prompt"><span class="tag" id="tag">1</span><span id="promptText">だれが</span><span>？</span></div>
        <div id="answerArea"></div>
        <div class="fb" id="fb" role="status" aria-live="polite"></div>
        <div class="sentence" aria-label="できあがりの ぶん">
          <span class="slot" id="slotWho">ああああ</span><span>が、</span><span class="slot" id="slotWhat">ああああああ</span><span>。</span>
        </div>
        <div class="nextrow" id="nextRow" hidden><button class="btn" id="nextBtn" type="button">つぎへ →</button></div>
      </div>
    </div>
  </section>

  <!-- Result -->
  <section id="result" class="screen" hidden>
    <div class="toolbar"><span></span><button class="chip sndBtn" type="button" aria-label="おと"></button></div>
    <div class="res">
      <h2 id="resTitle"></h2>
      <p id="resMsg"></p>
      <div class="list" id="resList"></div>
      <div class="resbtns">
        <button class="btn" id="againBtn" type="button">もういちど</button>
        <button class="btn white" id="homeBtn" type="button">スタートへ</button>
        <button class="btn pink" id="replayBtn" type="button" hidden>♪ もういちど きく</button>
      </div>
    </div>
  </section>
</div>
<canvas id="fx"></canvas>

const $ = s=>document.querySelector(s);
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sameGroup=(groups,a,b)=>a===b||groups.some(g=>g.includes(a)&&g.includes(b));
const kata2hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>kata2hira(String(s).normalize('NFKC')).replace(/[\s　。、．，.,！!？?「」]/g,'').toLowerCase();
function makeChoices(correct,pool,groups){
  const others=shuffle(pool.filter(x=>!sameGroup(groups,x,correct))).slice(0,3);
  return shuffle([correct,...others]);
}
function accepted(canon,altMap,isWho){
  const base=[canon,...(altMap[canon]||[])];
  const out=new Set();
  base.forEach(b=>{
    out.add(norm(b));
    if(b.endsWith('ている')){out.add(norm(b.slice(0,-3)+'てる'));out.add(norm(b.slice(0,-3)+'ています'))}
  });
  return out;
}
function isCorrect(input,canon,altMap,isWho){
  let v=norm(input);
  if(isWho&&v.endsWith('が'))v=v.slice(0,-1);
  if(v.endsWith('ている')||v.endsWith('てる')||v.endsWith('ています')){}
  return accepted(canon,altMap,isWho).has(v);
}

const Snd=(()=>{
  let ctx=null,master=null,bus=null,muted=false;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    try{
      if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
        ctx=new AC();master=ctx.createGain();master.gain.value=.6;master.connect(ctx.destination)}
      if(ctx.state==='suspended')ctx.resume();
      return true;
    }catch(e){return false}
  }
  function newBus(){
    if(bus){const old=bus,t=ctx.currentTime;try{old.gain.cancelScheduledValues(t);old.gain.setValueAtTime(old.gain.value,t);old.gain.linearRampToValueAtTime(0,t+.08)}catch(e){}setTimeout(()=>{try{old.disconnect()}catch(e){}},300)}
    bus=ctx.createGain();bus.gain.value=1;bus.connect(master);return bus;
  }
  function tone(t,m,dur,o={}){
    const {type='triangle',gain=.22,attack=.006,ring=dur}=o;
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type=type;osc.frequency.value=mtof(m);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+attack);
    g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.06,ring));
    osc.connect(g);g.connect(bus);osc.start(t);osc.stop(t+ring+.06);
  }
  const bell=(t,m,dur,gain=.22)=>{tone(t,m,dur,{type:'sine',gain,ring:dur*1.7});tone(t,m+12,dur,{type:'sine',gain:gain*.3,ring:dur*.9});tone(t,m,dur,{type:'triangle',gain:gain*.35,ring:dur*.7})};
  function noise(t,dur,gain){
    const n=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;
    const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=6500;
    const g=ctx.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(hp);hp.connect(g);g.connect(bus);src.start(t);
  }
  const SMALL=[
    [[72,0,.2],[76,.1,.2],[79,.2,.2],[84,.3,.7]],
    [[67,0,.15],[72,.12,.15],[76,.24,.15],[79,.36,.15],[84,.48,.8]],
    [[74,0,.2],[79,.1,.2],[83,.2,.2],[86,.3,.7]]
  ];
  const BIG=[[72,0,.2],[76,.18,.2],[79,.36,.2],[76,.54,.2],[79,.72,.2],[84,.9,1.1]];
  function play(seq,chordAt,chord){
    if(muted||!init())return;
    newBus();const t0=ctx.currentTime+.02;
    seq.forEach(([m,s,d])=>bell(t0+s,m,d,.24));
    if(chordAt!=null)chord.forEach(m=>tone(t0+chordAt,m,1,{type:'triangle',gain:.09,ring:1.1}));
  }
  const api={
    init,
    get muted(){return muted},
    setMuted(v){muted=v;if(v&&bus)api.stop()},
    ok(i=0){play(SMALL[i%3],.3,[60,64,67])},
    done(){play(BIG,.9,[60,64,67,72])},
    ng(){
      if(muted||!init())return;newBus();const t=ctx.currentTime+.02;
      tone(t,67,.25,{type:'sine',gain:.14,ring:.3});tone(t+.17,62,.4,{type:'sine',gain:.14,ring:.45});
    },
    stop(){if(!ctx||!bus)return;const t=ctx.currentTime;try{bus.gain.cancelScheduledValues(t);bus.gain.setValueAtTime(bus.gain.value,t);bus.gain.linearRampToValueAtTime(0,t+.15)}catch(e){}},
    fanfare(){
      if(muted||!init())return 0;
      newBus();const t0=ctx.currentTime+.05,B=60/144;
      const chords={C:[48,[60,64,67]],F:[53,[60,65,69]],G:[55,[59,62,67]],Dm:[50,[57,62,65]]};
      const prog=[['C','C'],['F','C'],['G','F'],['C','C'],['F','C'],['Dm','G'],['C']];
      // きらきら
      [84,88,91,96,100,103,108].forEach((m,i)=>bell(t0+i*.05,m-12,.5,.12));
      noise(t0,1.2,.12);
      // ばんそう
      prog.forEach((bar,b)=>{
        const last=b===prog.length-1;
        bar.forEach((name,h)=>{
          const [root,tri]=chords[name],start=t0+(b*4+h*2)*B;
          if(last){tone(start,root,3.6*B,{type:'sine',gain:.3,ring:3.6*B});tri.forEach(m=>tone(start,m,3.6*B,{type:'triangle',gain:.09,ring:3.6*B}));return}
          tone(start,root,1.6*B,{type:'sine',gain:.3,ring:1.5*B});
          tri.forEach(m=>tone(start+B,m,.8*B,{type:'triangle',gain:.07,ring:.9*B}));
        });
      });
      // メロディ [はく, ノート, ながさ]
      const mel=[[0,72,.5],[.5,72,.5],[1,76,.5],[1.5,79,.5],[2,84,2],
        [4,81,1],[5,79,.5],[5.5,77,.5],[6,76,2],
        [8,74,.5],[8.5,76,.5],[9,77,.5],[9.5,79,.5],[10,81,1],[11,77,1],
        [12,79,2],[14,76,1],[15,79,1],
        [16,84,1],[17,83,.5],[17.5,81,.5],[18,79,1],[19,76,1],
        [20,77,1],[21,74,1],[22,79,1],[23,83,1],
        [24,84,4]];
      mel.forEach(([b,m,d])=>{const t=t0+b*B;tone(t,m,d*B,{type:'triangle',gain:.2,ring:Math.max(d*B,.25)*1.3});tone(t,m+12,d*B,{type:'sine',gain:.05,ring:d*B})});
      // フィナーレ
      const tf=t0+24*B;noise(tf,1.4,.14);[96,100,103,108].forEach((m,i)=>bell(tf+.12+i*.09,m-12,.7,.14));
      return 28*B+1.2;
    }
  };
  return api;
})();

const Fx=(()=>{
  const cv=$('#fx'),c=cv.getContext('2d');let ps=[],raf=0,endAt=0,last=0,spawnUntil=0,W=0,H=0,dpr=1;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PET=['#ffc2d4','#ffadc4','#ff93b0','#ffe0ea','#ffffff'],CON=['#ffd84a','#8fd3ff','#5ee6a0','#ff9bb3','#c8a2ff'];
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0)}
  function make(fromTop){
    const petal=Math.random()<.78;
    return {petal,x:Math.random()*W,y:fromTop?-20-Math.random()*40:Math.random()*H*.6-H*.1,
      s:petal?7+Math.random()*9:6+Math.random()*6,vy:55+Math.random()*80,vx:-30-Math.random()*50,
      rot:Math.random()*6.28,vr:(Math.random()-.5)*4,flip:Math.random()*6.28,vf:2+Math.random()*4,
      ph:Math.random()*6.28,amp:20+Math.random()*40,col:(petal?PET:CON)[Math.floor(Math.random()*(petal?PET.length:CON.length))]};
  }
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000||.016);last=now;
    c.clearRect(0,0,W,H);
    if(now<spawnUntil){const n=reduce?1:3;for(let i=0;i<n;i++)if(Math.random()<.6)ps.push(make(true))}
    ps.forEach(p=>{
      p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(p.ph+=dt*2)*p.amp)*dt;p.rot+=p.vr*dt;p.flip+=p.vf*dt;
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.scale(1,Math.cos(p.flip));c.fillStyle=p.col;c.beginPath();
      if(p.petal){c.ellipse(0,0,p.s,p.s*.6,0,0,6.283)}else{c.rect(-p.s/2,-p.s/3,p.s,p.s*.66)}
      c.fill();c.restore();
    });
    ps=ps.filter(p=>p.y<H+30&&p.x>-60);
    if(now<spawnUntil||ps.length){raf=requestAnimationFrame(frame)}else{raf=0;c.clearRect(0,0,W,H)}
  }
  return{
    start(ms){
      size();const now=performance.now();ps=[];
      for(let i=0;i<(reduce?30:110);i++)ps.push(make(false));
      spawnUntil=now+ms;last=now;if(!raf)raf=requestAnimationFrame(frame);
    },
    stop(){spawnUntil=0;ps=[];if(raf){cancelAnimationFrame(raf);raf=0}c.clearRect(0,0,W,H)}
  };
})();

function submitText(){
  Snd.init();
  const inp=$('#ans'),v=inp.value.trim();if(!v){inp.focus();return}
  const it=S.qs[S.qi],step=S.step;
  const ok=step===0?isCorrect(v,it.who,WHO_ALT,true):isCorrect(v,it.what,WHAT_ALT,false);
  if(ok){inp.disabled=true;stepDone(false)}
  else{
    S.tries++;
    const row=$('#irow');row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');
    const canon=step===0?it.who:it.what;
    if(S.tries>=3){inp.disabled=true;wrong(true);revealAnswer(canon);return}
    wrong(false,S.tries>=2?canon:null);inp.select();
  }
}
function wrong(noMsg,hintFrom){
  S.miss=true;Snd.ng();
  let extra='';
  if(hintFrom)extra=`<small>ヒント：さいしょの もじは「${hintFrom[0]}」</small>`;
  setFb('ng','もうちょっと'+extra);
}
function revealAnswer(canon){
  setFb('ng',`もうちょっと<small>こたえは「${canon}」</small>`);
  stepDone(true);
}
function stepDone(revealed){
  const it=S.qs[S.qi],step=S.step;
  const slot=step===0?$('#slotWho'):$('#slotWhat');
  slot.classList.remove('active');slot.classList.add(revealed?'missed':'filled');
  if(!revealed){
    setFb('ok','せいかい！');
    if(step===0)Snd.ok(S.qi);else Snd.done();
  }
  if(step===0){setTimeout(()=>{if(S&&S.qs[S.qi]===it&&S.step===0)showStep(1)},revealed?1800:1100)}
  else{
    S.results.push({it,perfect:!S.miss});
    $('#nextBtn').textContent=S.qi===TOTAL-1?'けっかを みる →':'つぎへ →';
    $('#nextRow').hidden=false;$('#nextBtn').focus({preventScroll:true});
    paintDots();
  }
}
$('#nextBtn').addEventListener('click',()=>{
  Snd.init();Snd.stop();
  if(S.qi>=TOTAL-1)return showResult();
  S.qi++;renderQuestion();
});
$('#quitBtn').addEventListener('click',()=>{Snd.stop();Fx.stop();show('start')});

/* ---------- 結果 ---------- */
function showResult(){
  const score=S.results.filter(r=>r.perfect).length,perfect=score===TOTAL;
  show('result');
  $('#resTitle').innerHTML=perfect?'ぜんもん <em>せいかい</em>！<br>すごい！':`${TOTAL}もんちゅう <em>${score}もん</em> せいかい`;
  $('#resMsg').textContent=perfect?'ぜんぶ ただしく こたえられたね。おめでとう！':(score>=3?'あと すこしで ぜんもんせいかい！ もういちど やってみよう。':'まちがえたところを よんで、もういちど ちょうせんしよう。');
  const list=$('#resList');list.innerHTML='';
  S.results.forEach(r=>{
    const row=document.createElement('div');row.className='rrow';
    const img=document.createElement('img');img.src=IMG[r.it.k];img.alt='';
    const t=document.createElement('div');t.className='t';t.textContent=fullText(r.it);
    const m=document.createElement('div');m.className='mark '+(r.perfect?'ok':'miss');m.textContent=r.perfect?'せいかい':'おしい';
    row.append(img,t,m);list.appendChild(row);
  });
  $('#replayBtn').hidden=!perfect;
  Fx.stop();Snd.stop();
  if(perfect)celebrate();
}
function celebrate(){
  const len=Snd.fanfare();
  Fx.start(Math.max(9000,(len||0)*1000+2500));
}
$('#replayBtn').addEventListener('click',()=>{Snd.init();celebrate()});
$('#againBtn').addEventListener('click',()=>startGame(S.mode));
$('#homeBtn').addEventListener('click',()=>{Snd.stop();Fx.stop();show('start')});
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.mode)));
</script>
