<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>さくらんぼけいさん（たしざん）</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;height:100%;font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:#fff0f5;color:#5a2d3c;overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;position:relative}
.fs{position:absolute;top:8px;left:8px;width:48px;height:48px;border-radius:14px;border:3px solid #ff8fb1;background:#fff;font-size:24px;cursor:pointer}
h1{font-size:clamp(28px,7vw,48px);margin:8px 0;color:#e0457b;line-height:1.2}
h1 small{display:block;font-size:.55em;color:#c2678a}
.btn{font-family:inherit;font-size:clamp(22px,5vw,30px);font-weight:bold;border:none;border-radius:999px;padding:14px 36px;background:#ff5c8a;color:#fff;box-shadow:0 6px 0 #c93a66;cursor:pointer;margin:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c93a66}
.btn.g{background:#4cc38a;box-shadow:0 6px 0 #2f9a67}
.credit{margin-top:24px;font-size:16px;color:#a5607a}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:6px}
.dot{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #ff8fb1}
.dot.on{background:#ff5c8a}.dot.now{border-color:#e0457b;transform:scale(1.3)}
.card{background:#fff;border-radius:28px;padding:16px 8px;box-shadow:0 6px 0 #ffc2d6;width:min(440px,100%)}
.nums{display:flex;justify-content:center;align-items:flex-start;gap:2px;font-size:clamp(44px,12vw,68px);line-height:1.1;font-weight:bold;color:#e0457b}
.col{width:clamp(98px,26vw,132px);display:flex;flex-direction:column;align-items:center}
.plus{width:.8em;line-height:1.1}.aw{height:1.1em;display:flex;align-items:center;margin-left:2px}
.pair{display:flex;gap:8px;margin-top:0}
.box{width:clamp(44px,12vw,58px);height:clamp(52px,14vw,66px);border:4px solid #ff8fb1;border-radius:14px;background:#fff9fb;font-size:clamp(30px,8vw,40px);font-weight:bold;color:#5a2d3c;display:flex;align-items:center;justify-content:center;cursor:pointer}
.box.sel{border-color:#2f8cff;background:#e6f1ff;box-shadow:0 0 0 4px #bcd9ff}
.row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:26px;font-weight:bold}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(440px,100%);margin-top:12px}
.pad button{font-family:inherit;font-size:30px;font-weight:bold;height:clamp(52px,13vw,62px);border-radius:14px;border:none;background:#ffd84d;color:#5a2d3c;box-shadow:0 4px 0 #d9ae1a;cursor:pointer}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9ae1a}
.pad button.del{background:#ffb3c8;box-shadow:0 4px 0 #d98aa3;font-size:22px}
#msg{height:44px;font-size:30px;font-weight:bold;color:#e0457b;margin:6px 0 0}
.big{font-size:clamp(30px,7.5vw,46px);color:#e0457b;font-weight:bold;margin:12px 0;line-height:1.3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light}}
</style></head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function play(notes){const c=ac();if(!c)return;let t=c.currentTime+0.02;
 notes.forEach(([f,d])=>{if(f){const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d*0.95);
 o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d);}t+=d;});}
const OK=[[523,.12],[659,.12],[784,.12],[1047,.3]];
const WIN=[[523,.15],[523,.15],[784,.15],[784,.15],[880,.15],[880,.15],[784,.3],[698,.15],[698,.15],[659,.15],[659,.15],[587,.15],[587,.15],[523,.4],[0,.1],[523,.12],[659,.12],[784,.12],[1047,.5]];
const NG=[[330,.18],[262,.3]];

const cherry=(s=90)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M50 8 C60 25 55 40 35 62 M50 8 C58 28 68 45 70 62" stroke="#3a9a52" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M50 8 C65 2 78 8 82 18 C70 20 58 16 50 8Z" fill="#59c26f"/><circle cx="32" cy="72" r="20" fill="#ff4f7d"/><circle cx="72" cy="72" r="20" fill="#ff4f7d"/><circle cx="25" cy="65" r="5" fill="#fff" opacity=".6"/><circle cx="65" cy="65" r="5" fill="#fff" opacity=".6"/><circle cx="26" cy="75" r="2.5" fill="#5a2d3c"/><circle cx="38" cy="75" r="2.5" fill="#5a2d3c"/><path d="M28 81 Q32 85 36 81" stroke="#5a2d3c" stroke-width="2" fill="none"/><circle cx="66" cy="75" r="2.5" fill="#5a2d3c"/><circle cx="78" cy="75" r="2.5" fill="#5a2d3c"/><path d="M68 81 Q72 85 76 81" stroke="#5a2d3c" stroke-width="2" fill="none"/></svg>`;

function fs(){const d=document.documentElement;
 if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
 else{const f=d.requestFullscreen||d.webkitRequestFullscreen;if(f){try{f.call(d)}catch(e){}}else alert('このブラウザでは全画面にできません')}}

function start(){app.innerHTML=`
<button class="fs" onclick="fs()" aria-label="全画面表示">⛶</button>
<div style="display:flex;gap:6px;align-items:center">${cherry(80)}${cherry(110)}${cherry(80)}</div>
<h1>さくらんぼけいさん<small>（たしざん）</small></h1>
<button class="btn" onclick="begin()">🍒 はじめる</button>
<div class="credit">きだっち＠明倫小</div>`}

let Q=[],idx=0,cur,v,sel;
function genQ(){const used=new Set(),r=[];
 while(r.length<5){const a=2+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*8);
  if(a+b<11||used.has(a+','+b))continue;used.add(a+','+b);r.push([a,b])}
 return r}
function begin(){ac();if(AC&&AC.state==='suspended')AC.resume();Q=genQ();idx=0;load()}
function load(){cur=Q[idx];v=['','',''];sel=0;draw('')}
function draw(m){
 const [a,b]=cur,leftSmall=a<b;
 const sm=leftSmall?a:b;
 const dots=Q.map((_,i)=>`<div class="dot ${i<idx?'on':''} ${i===idx?'now':''}"></div>`).join('');
 const lines=`<svg width="90" height="30" viewBox="0 0 110 34"><path d="M55 0 L25 32 M55 0 L85 32" stroke="#ff8fb1" stroke-width="4" stroke-linecap="round"/></svg>`;
 const bx=i=>`<div class="box ${sel===i?'sel':''}" onclick="pick(${i})">${v[i]}</div>`;
 const small=`<div class="col"><div>${sm}</div>${lines}<div class="pair">${bx(0)}${bx(1)}</div></div>`;
 const big=`<div class="col"><div>${leftSmall?b:a}</div></div>`;
 app.innerHTML=`
 <button class="fs" onclick="fs()" aria-label="全画面表示">⛶</button>
 <div class="dots">${dots}</div>
 <div class="card"><div class="nums">${leftSmall?small:big}<div class="plus">＋</div>${leftSmall?big:small}<div class="plus">＝</div><div class="aw">${bx(2)}</div></div></div>
 <div id="msg">${m}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button onclick="num(${n})">${n}</button>`).join('')}
 <button class="del" style="grid-column:span 3" onclick="del()">⌫ けす</button>
 <button class="del" style="grid-column:span 2;background:#7fd6a5;box-shadow:0 4px 0 #4fa97a" onclick="check()">✔ できた</button></div>`}
function pick(i){sel=i;draw('')}
function num(n){
 if(sel===2){if(v[2].length>=2)v[2]='';v[2]+=n}else{v[sel]=String(n);if(sel===0&&v[1]==='')sel=1}
 draw('')}
function del(){v[sel]='';draw('')}
function check(){
 if(v.some(x=>x==='')){draw('ぜんぶ いれてね');return}
 const [a,b]=cur,sm=Math.min(a,b),bg=Math.max(a,b),x=+v[0],y=+v[1],ans=+v[2];
 const ok=x+y===sm&&(x===10-bg||y===10-bg)&&ans===a+b;
 if(ok){play(OK);draw('🎵 せいかい！');setTimeout(()=>{idx++;idx>=5?end():load()},1400)}
 else{play(NG);v=['','',''];sel=0;draw('もうちょっと')}}
function end(){play(WIN);app.innerHTML=`
<button class="fs" onclick="fs()" aria-label="全画面表示">⛶</button>
<div style="display:flex;gap:6px;align-items:center">${cherry(90)}${cherry(120)}${cherry(90)}</div>
<div class="big">おめでとう！<br>つぎもがんばろうね！</div>
<div><button class="btn g" onclick="begin()">🔁 もういちど</button>
<button class="btn" onclick="start()">🏠 おわる</button></div>`}
start();
</script></body></html>
