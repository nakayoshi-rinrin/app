<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三角形と四角形</title>
<style>
:root{--bg:#fff7e0;--card:#fff;--ink:#3b2f2f;--main:#ff8a3d;--sub:#3dafff;--ok:#2bb673;--ng:#e5484d;--line:#e0b86a;--dot:#8a7a6a;--draw:#e5484d;--shape:#2a5bd7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a2e;--card:#2c2640;--ink:#f6efe6;--line:#6b5b8c;--dot:#b8aacb;--draw:#ff7b80;--shape:#7fa6ff}}
:root[data-theme="dark"]{--bg:#1f1a2e;--card:#2c2640;--ink:#f6efe6;--line:#6b5b8c;--dot:#b8aacb;--draw:#ff7b80;--shape:#7fa6ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif;overflow-x:hidden}
.screen{display:none;min-height:100%;padding:16px;flex-direction:column;align-items:center;position:relative}
.screen.on{display:flex}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:12px 22px;font-weight:bold;color:#fff;background:var(--main);box-shadow:0 4px 0 rgba(0,0,0,.2)}
button:active{transform:translateY(3px);box-shadow:none}
button.b{background:var(--sub)} button.g{background:var(--ok)} button.gray{background:#8d8d99}
#fs{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;padding:8px 14px;font-size:15px;background:var(--card);color:var(--ink)}
#start{justify-content:center;gap:28px;text-align:center}
#start h1{font-size:clamp(36px,9vw,72px);margin:0;color:var(--main);text-shadow:3px 3px 0 var(--card)}
.courses{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.courses button{font-size:clamp(22px,5vw,34px);padding:18px 36px}
.credit{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:18px}
.top{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:bold}
.panels{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:10px 0;width:100%;max-width:820px}
.panel{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px;flex:1 1 300px;max-width:380px;text-align:center}
.panel h3{margin:2px 0 4px;font-size:18px}
svg{width:100%;height:auto;touch-action:manipulation;display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#msg{height:48px;font-size:30px;font-weight:bold;margin:6px 0;text-align:center}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#result{justify-content:center;gap:20px;text-align:center}
#result h2{font-size:clamp(30px,7vw,56px);margin:0}
#conf{position:fixed;inset:0;pointer-events:none;z-index:5;width:100%;height:100%}
</style>
</head>
<body>

<section id="start" class="screen on">
  <button id="fs">⛶ ぜんがめん</button>
  <h1>三角形と四角形</h1>
  <div class="courses">
    <button class="g" data-c="easy">かんたん</button>
    <button data-c="hard">むずかしい</button>
  </div>
  <div class="credit">きだっち＠明倫小</div>
</section>

<section id="game" class="screen">
  <div class="top"><span id="qn"></span><span id="cn"></span></div>
  <div class="panels">
    <div class="panel"><h3>おてほん</h3><svg id="sample" viewBox="0 0 336 264"></svg></div>
    <div class="panel"><h3>おなじ かたちを かこう</h3><svg id="ans" viewBox="0 0 336 264"></svg></div>
  </div>
  <div id="msg"></div>
  <div class="btns">
    <button class="gray" id="undo">ひとつ けす</button>
    <button class="gray" id="clear">ぜんぶ けす</button>
    <button class="b" id="check">できた！</button>
    <button class="g" id="next" style="display:none">つぎへ ▶</button>
  </div>
</section>

<section id="result" class="screen">
  <h2 id="rt"></h2>
  <div id="rs" style="font-size:24px"></div>
  <div class="btns">
    <button id="again">もういちど</button>
    <button class="b" id="home">さいしょへ</button>
  </div>
</section>
<canvas id="conf"></canvas>

<script>
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
const COLS=9, ROWS=7, S=36, M=24;
let course, qs, qi, missAny, missCount, shape, drawn, sel, solved;

/* ---------- 音 ---------- */
let ac;
function tone(f,t,d,type="triangle",v=.18){
  if(!f)return; const o=ac.createOscillator(), g=ac.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.start(t);o.stop(t+d+.05);
}
function play(seq,step){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
  const t0=ac.currentTime+.05;seq.forEach((n,i)=>{const [f,l=1,h]=Array.isArray(n)?n:[n];tone(f,t0+i*step,step*l*1.4);if(h)tone(h,t0+i*step,step*l*1.4,"sine",.1)})}catch(e){}}
const okSnd=()=>play([523,659,784,1047,[784],[1047,2]],.13);
const ngSnd=()=>play([330,262],.2);
const bigSnd=()=>play([[523,1,262],[523,1,262],[784,1,392],[784,1,392],[880,1,440],[880,1,440],[784,2,392],[698],[698],[659],[659],[587],[587],[523,2,262],
  [659],[784],[1047,1,523],[988],[1047,1,523],[1175],[1319,1,659],[1568,3,784],[1047],[1319],[1568,5,784]],.22);

/* ---------- 図形生成 ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
function norm(p){ // 回転・反転して原点へ
  const sw=R(0,1),fx=R(0,1),fy=R(0,1);
  p=p.map(([x,y])=>{if(sw)[x,y]=[y,x];if(fx)x=-x;if(fy)y=-y;return[x,y]});
  const mx=Math.min(...p.map(a=>a[0])),my=Math.min(...p.map(a=>a[1]));
  return p.map(([x,y])=>[x-mx,y-my]);
}
const bbox=p=>[Math.max(...p.map(a=>a[0])),Math.max(...p.map(a=>a[1]))];
function tilted(sq){
  const [p,q]=[[1,1],[1,2],[2,1]][R(0,2)]; const m=R(1,2),k=sq?m:(m===1?2:1);
  const u=[p*m,q*m],v=[-q*k,p*k];
  return [[0,0],u,[u[0]+v[0],u[1]+v[1]],v];
}
function gen(type,easy){
  for(let n=0;n<500;n++){
    let p;
    if(type==="tri"){
      if(easy){const w=R(2,4),h=R(2,4);p=[[0,0],[w,0],[0,h]]}
      else{p=[0,0,0].map(()=>[R(0,5),R(0,4)]);const a=Math.abs(cross(...p));if(a<4||a>14)continue;
        if(p.some((a,i)=>{const b=p[(i+1)%3];return a[0]===b[0]&&a[1]===b[1]}))continue}
    }else if(type==="rect"){
      if(!easy&&Math.random()<.4)p=tilted(false);
      else{const w=R(2,5),h=R(1,4);if(w===h)continue;p=[[0,0],[w,0],[w,h],[0,h]]}
    }else if(type==="square"){
      if(!easy&&Math.random()<.4)p=tilted(true);
      else{const s=R(2,4);p=[[0,0],[s,0],[s,s],[0,s]]}
    }else if(type==="para"){
      const w=R(2,4),h=R(1,3),s=R(1,2);p=[[0,0],[w,0],[w+s,h],[s,h]];
    }else if(type==="trap"){
      const a=R(3,5),b=R(1,3),o=R(0,a-b),h=R(1,3);if(a===b)continue;p=[[0,0],[a,0],[o+b,h],[o,h]];
      if(o===0&&a-b===0)continue;
    }else if(type==="rhomb"){
      const a=R(1,2),b=R(1,3);if(a===b)continue;p=[[a,0],[2*a,b],[a,2*b],[0,b]];
    }else if(type==="quad"){
      let q=[0,1,2,3].map(()=>[R(0,5),R(0,4)]);
      const cx=q.reduce((s,a)=>s+a[0],0)/4,cy=q.reduce((s,a)=>s+a[1],0)/4;
      q.sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
      let ok=true;for(let i=0;i<4;i++)if(cross(q[i],q[(i+1)%4],q[(i+2)%4])<=0)ok=false;
      if(!ok)continue;
      const e=i=>[q[(i+1)%4][0]-q[i][0],q[(i+1)%4][1]-q[i][1]];
      if(e(0)[0]*e(2)[1]-e(0)[1]*e(2)[0]===0||e(1)[0]*e(3)[1]-e(1)[1]*e(3)[0]===0)continue;
      const ar=Math.abs(cross(q[0],q[1],q[2]))+Math.abs(cross(q[0],q[2],q[3]));if(ar<8)continue;
      const L=i=>e(i)[0]**2+e(i)[1]**2;if(L(0)===L(1)||L(1)===L(2)||L(2)===L(3)||L(3)===L(0))continue;
      p=q;
    }
    p=norm(p);const [bw,bh]=bbox(p);if(bw<=6&&bh<=5)return p;
  }
  return norm([[0,0],[3,0],[3,2],[0,2]]);
}
function makeQs(easy){
  const t=easy?shuf(["tri","tri","rect","square",["tri","rect","square"][R(0,2)]]):shuf(["tri","rect","square","para","trap","rhomb","quad"]).slice(0,5);
  return t.map(x=>gen(x,easy));
}

/* ---------- 描画 ---------- */
const px=x=>M+x*S, py=y=>M+y*S;
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
function grid(svg){svg.innerHTML="";for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)el("circle",{cx:px(x),cy:py(y),r:4,fill:"var(--dot)"},svg)}
function drawSample(){
  const svg=$("sample");grid(svg);const [bw,bh]=bbox(shape);const ox=Math.floor((COLS-1-bw)/2),oy=Math.floor((ROWS-1-bh)/2);
  const pts=shape.map(([x,y])=>`${px(x+ox)},${py(y+oy)}`).join(" ");
  el("polygon",{points:pts,fill:"none",stroke:"var(--shape)","stroke-width":5,"stroke-linejoin":"round"},svg);
  shape.forEach(([x,y])=>el("circle",{cx:px(x+ox),cy:py(y+oy),r:6,fill:"var(--shape)"},svg));
}
function drawAns(){
  const svg=$("ans");grid(svg);
  drawn.forEach(s=>el("line",{x1:px(s[0]),y1:py(s[1]),x2:px(s[2]),y2:py(s[3]),stroke:"var(--draw)","stroke-width":5,"stroke-linecap":"round"},svg));
  if(sel)el("circle",{cx:px(sel[0]),cy:py(sel[1]),r:11,fill:"none",stroke:"var(--main)","stroke-width":4},svg);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=el("circle",{cx:px(x),cy:py(y),r:17,fill:"transparent",style:"cursor:pointer"},svg);
    c.addEventListener("pointerdown",e=>{e.preventDefault();tap(x,y)});
  }
}
function tap(x,y){
  if(solved)return; $("msg").textContent="";
  if(!sel){sel=[x,y]}
  else if(sel[0]===x&&sel[1]===y){sel=null}
  else{
    const a=[sel[0],sel[1],x,y],b=[x,y,sel[0],sel[1]];
    const i=drawn.findIndex(s=>s.join()===a.join()||s.join()===b.join());
    if(i>=0)drawn.splice(i,1);else drawn.push(a);
    sel=null;
  }
  drawAns();
}
/* ---------- 判定 ---------- */
const gcd=(a,b)=>b?gcd(b,a%b):a;
function units(segs){
  const out=[];
  segs.forEach(([x1,y1,x2,y2])=>{const dx=x2-x1,dy=y2-y1,g=gcd(Math.abs(dx),Math.abs(dy));
    for(let i=0;i<g;i++){const a=[x1+dx/g*i,y1+dy/g*i],b=[a[0]+dx/g,a[1]+dy/g];out.push(a[0]<b[0]||(a[0]===b[0]&&a[1]<b[1])?[...a,...b]:[...b,...a])}});
  if(!out.length)return null;
  const mx=Math.min(...out.map(s=>Math.min(s[0],s[2]))),my=Math.min(...out.map(s=>Math.min(s[1],s[3])));
  return new Set(out.map(s=>[s[0]-mx,s[1]-my,s[2]-mx,s[3]-my].join()));
}
function correct(){
  const t=units(shape.map((p,i)=>{const q=shape[(i+1)%shape.length];return[p[0],p[1],q[0],q[1]]}));
  const u=units(drawn);if(!u||u.size!==t.size)return false;
  for(const k of t)if(!u.has(k))return false;return true;
}

/* ---------- 進行 ---------- */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));if(id!=="result")stopConf()}
function startQ(){
  shape=qs[qi];drawn=[];sel=null;solved=false;missAny=false;
  $("qn").textContent=`だい ${qi+1} もん / 5`;$("cn").textContent=course==="easy"?"かんたん":"むずかしい";
  $("msg").textContent="";$("check").style.display="";$("next").style.display="none";
  drawSample();drawAns();
}
function begin(c){course=c;qs=makeQs(c==="easy");qi=0;missCount=0;show("game");startQ()}
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{play([880],.1);begin(b.dataset.c)});
$("undo").onclick=()=>{if(solved)return;drawn.pop();sel=null;$("msg").textContent="";drawAns()};
$("clear").onclick=()=>{if(solved)return;drawn=[];sel=null;$("msg").textContent="";drawAns()};
$("check").onclick=()=>{
  const m=$("msg");
  if(correct()){
    solved=true;m.style.color="var(--ok)";m.textContent="せいかい！🎉";okSnd();
    $("check").style.display="none";$("next").style.display="";
    $("next").textContent=qi===4?"けっかを みる ▶":"つぎへ ▶";
  }else{
    if(!missAny){missAny=true;missCount++}
    m.style.color="var(--ng)";m.textContent="もうちょっと";ngSnd();
    m.classList.remove("shake");void m.offsetWidth;m.classList.add("shake");
  }
};
$("next").onclick=()=>{if(qi<4){qi++;startQ()}else finish()};
function finish(){
  show("result");const perfect=missCount===0;
  $("rt").textContent=perfect?"ぜんぶ せいかい！すごい！🎉":"おつかれさま！";
  $("rs").textContent=perfect?"5もん ぜんぶ いっぱつで せいかい！":`いっぱつで せいかいは ${5-missCount} もん`;
  if(perfect){bigSnd();startConf()}
}
$("again").onclick=()=>begin(course);
$("home").onclick=()=>show("start");

/* ---------- 全画面 ---------- */
$("fs").onclick=()=>{
  try{const d=document,e=d.documentElement;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
    else{(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}}catch(err){}
};

/* ---------- 花吹雪 ---------- */
const cv=$("conf"),cx=cv.getContext("2d");let petals=[],raf=0;
function sizeC(){cv.width=innerWidth;cv.height=innerHeight}
function startConf(){
  stopConf();sizeC();const cols=["#ffb7c5","#ff8fab","#ffd6e0","#fff0f3","#ffc2d1"];
  petals=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,r:6+Math.random()*8,a:Math.random()*6.28,va:(Math.random()-.5)*.1,vy:1.5+Math.random()*2.5,vx:(Math.random()-.5)*2,ph:Math.random()*6.28,c:cols[R(0,4)]}));
  const loop=()=>{cx.clearRect(0,0,cv.width,cv.height);
    petals.forEach(p=>{p.y+=p.vy;p.ph+=.03;p.x+=p.vx+Math.sin(p.ph)*1.2;p.a+=p.va;
      if(p.y>cv.height+20){p.y=-20;p.x=Math.random()*cv.width}
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.beginPath();cx.ellipse(0,0,p.r,p.r*.55,0,0,6.28);cx.fill();cx.restore()});
    raf=requestAnimationFrame(loop)};loop();
}
function stopConf(){cancelAnimationFrame(raf);cx.clearRect(0,0,cv.width,cv.height)}
addEventListener("resize",()=>{if(raf)sizeC()});
</script>
</body>
</html>
